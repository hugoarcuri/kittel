<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kittel — Diccionario Teológico del NT</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
<style>
:root {
    --accent: #C8B88A;
    --accent-dark: #B8A87A;
    --header-bg: #2A0808;
    --bg: #F5F2EB;
    --sidebar-bg: #FAF8F4;
    --sidebar-border: #E8E0C8;
    --card-bg: #FFFFFF;
    --text: #1C1814;
    --text-muted: #8A8072;
    --text-light: #B0A898;
    --font-bar-bg: #F0ECE4;
    --badge-bg: #F0E8D0;
    --shadow: 0 2px 12px rgba(0,0,0,0.07);
    --shadow-lg: 0 4px 24px rgba(0,0,0,0.10);
    --scrollbar-track: #F0ECE4;
    --scrollbar-thumb: #C8B88A;
    --griego-color: #2A0808;
    --welcome-bg: #F5F2EB;
}
.dark {
    --bg: #1C1410;
    --sidebar-bg: #261E18;
    --sidebar-border: #3A3228;
    --card-bg: #2E2620;
    --text: #E8E0C8;
    --text-muted: #A89880;
    --text-light: #7A7062;
    --font-bar-bg: #2E2620;
    --badge-bg: #3A3228;
    --shadow: 0 2px 12px rgba(0,0,0,0.3);
    --shadow-lg: 0 4px 24px rgba(0,0,0,0.4);
    --scrollbar-track: #2E2620;
    --scrollbar-thumb: #5A5040;
    --griego-color: #E8E0C8;
    --welcome-bg: #1C1410;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", system-ui, sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; transition: background 0.2s, color 0.2s; }

header { background: var(--header-bg); color: #fff; padding: 10px 20px; display: flex; align-items: center; gap: 12px; flex-shrink: 0; flex-wrap: wrap; }
header .logo { height: 66px; width: auto; flex-shrink: 0; }
header h1 { font-size: 22px; font-weight: 700; white-space: nowrap; }
header input { flex: 0 1 320px; min-width: 140px; padding: 10px 16px; border: none; border-radius: 10px; font-size: 16px; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif; font-weight: 400; letter-spacing: -0.2px; outline: none; background: #fff; }
header input::placeholder { color: #999; font-weight: 400; opacity: 0.7; }
#verseRef { font-size: 14px; color: rgba(255,255,255,0.5); font-style: italic; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lang-switch { display: inline-flex; border: 1px solid rgba(255,255,255,0.25); border-radius: 8px; overflow: hidden; flex-shrink: 0; }
.lang-switch button { background: none; border: none; color: rgba(255,255,255,0.45); font-size: 12px; font-weight: 700; padding: 5px 13px; cursor: pointer; transition: background 0.15s, color 0.15s; line-height: 1.2; }
.lang-switch button:hover { background: rgba(255,255,255,0.08); }
.lang-switch button.active { background: var(--accent); color: #1C1814; }
#search.gr { font-family: "Gentium Plus", "Noto Serif", "SBL Greek", "Galatia SIL", "Palatino Linotype", serif; font-size: 17px; }

header input:focus { box-shadow: 0 0 0 3px var(--accent); }
.header-right { display: flex; align-items: center; gap: 14px; margin-left: auto; }
#termCount { font-size: 13px; color: rgba(255,255,255,0.7); white-space: nowrap; }
#darkToggle { background: none; border: 1px solid rgba(255,255,255,0.25); color: #fff; font-size: 15px; padding: 5px 11px; border-radius: 6px; cursor: pointer; line-height: 1; transition: background 0.15s; }
#darkToggle:hover { background: rgba(255,255,255,0.1); }

main { display: flex; flex: 1; overflow: hidden; }

#sidebar { width: 380px; min-width: 200px; background: var(--sidebar-bg); border-right: 1px solid var(--sidebar-border); display: flex; flex-direction: column; overflow: hidden; transition: background 0.2s; }
#sidebarResize { width: 5px; cursor: col-resize; flex-shrink: 0; background: transparent; transition: background 0.15s; position: relative; z-index: 5; }
#sidebarResize:hover, #sidebarResize.active { background: var(--accent); }
#sidebar .font-bar { display: flex; align-items: center; gap: 6px; padding: 8px 14px; border-bottom: 1px solid var(--sidebar-border); background: var(--font-bar-bg); flex-shrink: 0; transition: background 0.2s; }
#sidebar .font-bar label { font-size: 12px; color: var(--text-muted); margin-right: 2px; font-weight: 500; }
#sidebar .font-bar .font-group { display: inline-flex; border: 1px solid rgba(0,0,0,0.08); border-radius: 6px; overflow: hidden; }
.dark #sidebar .font-bar .font-group { border-color: rgba(255,255,255,0.08); }
#sidebar .font-bar .font-group .font-btn { background: none; border: none; font-size: 15px; font-weight: 700; padding: 4px 10px; cursor: pointer; line-height: 1.3; color: #fff; transition: background 0.15s; }
#sidebar .font-bar .font-group .font-btn:hover { background: var(--accent); }
#sidebar .font-bar .font-group .font-btn:first-child { border-right: 1px solid rgba(0,0,0,0.08); }
.dark #sidebar .font-bar .font-group .font-btn:first-child { border-right-color: rgba(255,255,255,0.08); }
#sidebar .font-bar .font-group .font-btn:last-child { border-left: 1px solid rgba(0,0,0,0.08); }
.dark #sidebar .font-bar .font-group .font-btn:last-child { border-left-color: rgba(255,255,255,0.08); }
#sidebar .font-bar #fontSizeLabel { font-size: 13px; color: var(--text-muted); min-width: 22px; text-align: center; font-weight: 600; }
#sidebar .recent-section { padding: 8px 14px; border-bottom: 1px solid var(--sidebar-border); flex-shrink: 0; }
#sidebar .recent-section .recent-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-light); margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
#sidebar .recent-section .recent-title .clear-recent { background: none; border: none; color: var(--text-light); cursor: pointer; font-size: 12px; padding: 0 2px; line-height: 1; opacity: 0.5; transition: opacity 0.15s; }
#sidebar .recent-section .recent-title .clear-recent:hover { opacity: 1; }
#sidebar .recent-section .recent-item { font-size: 13px; padding: 4px 8px; border-radius: 4px; cursor: pointer; color: var(--text-muted); display: inline-block; margin: 2px 3px 2px 0; background: var(--font-bar-bg); transition: background 0.15s; }
#sidebar .recent-section .recent-item:hover { background: var(--accent); color: #fff; }
#sidebar .sidebar-results { flex: 1; overflow-y: auto; }
#sidebar .sidebar-results::-webkit-scrollbar { width: 6px; }
#sidebar .sidebar-results::-webkit-scrollbar-track { background: var(--scrollbar-track); }
#sidebar .sidebar-results::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 3px; }
#sidebar .match { padding: 14px 18px; border-bottom: 1px solid var(--sidebar-border); cursor: pointer; transition: background 0.15s, border-color 0.15s; }
#sidebar .match:hover { background: #F5F0E4; }
.dark #sidebar .match:hover { background: #322A20; }
#sidebar .match.active { background: #F0E8D0; border-left: 4px solid var(--accent); }
.dark #sidebar .match.active { background: #3A3220; }
#sidebar .match .griego { font-size: 18px; font-weight: 600; color: var(--griego-color); transition: color 0.2s; }
#sidebar .match .espanol { font-size: 14px; color: var(--text-muted); margin-top: 2px; }
#sidebar .match .preview { font-size: 12px; color: var(--text-light); margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
#sidebar .no-results { padding: 40px 18px; text-align: center; color: var(--text-light); font-size: 15px; }
#sidebar .letter-bar { display: flex; flex-wrap: wrap; gap: 1px; padding: 5px 10px; border-bottom: 1px solid var(--sidebar-border); background: var(--sidebar-bg); flex-shrink: 0; }
#sidebar .letter-bar .l { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 26px; font-size: 15px; font-weight: 600; cursor: pointer; border-radius: 4px; color: var(--text-muted); transition: background 0.12s, color 0.12s; user-select: none; }
#sidebar .letter-bar .l:hover { background: var(--accent); color: #fff; }
#sidebar .letter-bar .l.active { background: var(--accent); color: #fff; }
#sidebar .letter-bar .l .cnt { font-size: 8px; font-weight: 400; margin-left: 1px; opacity: 0.6; }

#content { flex: 1; overflow-y: auto; padding: 0; }
#visitCounter { position: fixed; bottom: 8px; right: 10px; font-size: 12px; color: var(--text-light); background: var(--card-bg); padding: 5px 12px; border-radius: 8px; box-shadow: var(--shadow); z-index: 10; opacity: 0.75; user-select: none; transition: opacity 0.2s; }
#visitCounter:hover { opacity: 1; }
#content::-webkit-scrollbar { width: 6px; }
#content::-webkit-scrollbar-track { background: var(--scrollbar-track); }
#content::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 3px; }

#entry-view { padding: 30px 40px; max-width: 1030px; margin: 0 auto; }
#entry-view .entry-card { background: var(--card-bg); border-radius: 10px; padding: 32px 36px; box-shadow: var(--shadow); transition: box-shadow 0.2s, background 0.2s; }
#entry-view .entry-card:hover { box-shadow: var(--shadow-lg); }
#entry-view .entry-header { margin-bottom: 20px; padding-bottom: 14px; border-bottom: 2px solid var(--accent); }
#entry-view .entry-header .griego { font-size: 28px; font-weight: 700; color: var(--griego-color); transition: color 0.2s; }
#entry-view .entry-header .espanol { font-size: 16px; color: var(--text-muted); margin-top: 4px; }
#entry-view .entry-header .header-meta { display: flex; align-items: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
#entry-view .entry-header .header-meta .page-badge { display: inline-block; background: var(--accent); color: #fff; font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 10px; }
#entry-view .entry-header .header-meta .fav-btn, #entry-view .entry-header .header-meta .copy-btn, #entry-view .entry-header .header-meta .share-btn { background: none; border: 1px solid var(--sidebar-border); font-size: 12px; padding: 3px 10px; border-radius: 6px; cursor: pointer; color: var(--text-muted); transition: background 0.15s, color 0.15s; }
#entry-view .entry-header .header-meta .fav-btn:hover, #entry-view .entry-header .header-meta .copy-btn:hover, #entry-view .entry-header .header-meta .share-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
#entry-view .entry-header .header-meta .fav-btn.saved { background: var(--accent); color: #fff; border-color: var(--accent); }
#entry-view .entry-text { font-size: 18px; line-height: 1.85; color: var(--text); transition: color 0.2s; }
#entry-view .entry-text br { content: ""; display: block; margin-top: 14px; }
#entry-view .entry-text .greek-word { font-size: 1.15em; font-weight: 700; }
#entry-view .entry-text .section-title { font-size: 1.1em; font-weight: 700; }

.badge { display: inline-block; background: var(--badge-bg); color: var(--accent-dark); font-size: 13px; padding: 3px 10px; border-radius: 12px; margin-right: 4px; font-weight: 500; }

.welcome { background: var(--welcome-bg); min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 20px; text-align: center; transition: background 0.2s; }
.welcome h2 { font-size: 30px; font-weight: 700; color: var(--griego-color); margin-bottom: 4px; transition: color 0.2s; }
.welcome .sub { font-size: 16px; color: var(--text-muted); margin-bottom: 28px; }
.welcome .quick-grid { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; max-width: 500px; }
.welcome .quick-card { background: var(--card-bg); border: 1px solid var(--sidebar-border); border-radius: 10px; padding: 14px 24px; cursor: pointer; font-size: 16px; font-weight: 600; color: var(--griego-color); transition: background 0.15s, border-color 0.15s, color 0.15s, box-shadow 0.15s; box-shadow: var(--shadow); }
.welcome .quick-card:hover { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: var(--shadow-lg); }

@media (max-width: 900px) {
    #sidebar { width: 300px; min-width: 300px; }
    #sidebar .match { padding: 12px 14px; }
    #sidebar .match .griego { font-size: 16px; }
    #entry-view { padding: 20px 24px; }
    #entry-view .entry-card { padding: 24px 24px; }
}
@media (max-width: 700px) {
    main { flex-direction: column; }
    #sidebar { width: 100%; min-width: unset; max-height: 40vh; border-right: none; border-bottom: 1px solid var(--sidebar-border); }
    #sidebar .font-bar { padding: 6px 12px; }
    #entry-view { padding: 16px; }
    #entry-view .entry-card { padding: 18px; }
    #entry-view .entry-header .griego { font-size: 22px; }
    #entry-view .entry-text { font-size: 17px; }
    .welcome h2 { font-size: 24px; }
    .welcome .quick-card { padding: 10px 18px; font-size: 14px; }
}
@media (max-width: 480px) {
    header { padding: 10px 12px; gap: 8px; justify-content: center; }
    header .logo { height: 50px; }
    header h1 { font-size: 17px; }
    header input { padding: 10px 14px; font-size: 15px; min-width: 100px; flex: 1 1 100%; order: 3; }
    #verseRef { font-size: 12px; flex: 0 1 auto; }
    header .logo { height: 50px; }
    header h1 { font-size: 17px; }
    header input { padding: 10px 14px; font-size: 15px; min-width: 100px; }
    #termCount { font-size: 11px; }
    #darkToggle { font-size: 13px; padding: 4px 9px; }
    #sidebar { max-height: 30vh; }
    #sidebar .match { padding: 10px 12px; }
    #sidebar .match .griego { font-size: 15px; }
    #entry-view { padding: 12px; }
    #entry-view .entry-card { padding: 14px; }
    #entry-view .entry-header .griego { font-size: 19px; }
    #entry-view .entry-text { font-size: 15px; }
    .welcome h2 { font-size: 20px; }
    .welcome .sub { font-size: 14px; }
    #visitCounter { font-size: 11px; padding: 4px 10px; }
}
</style>
</head>
<body>

<header>
    <img class="logo" src="logo.png" alt="HAEDO">
    <h1>Kittel</h1>
    <input type="text" id="search" placeholder="Escribí una palabra en español…" autofocus>
    <div class="lang-switch" id="langSwitch">
        <button class="active" data-lang="ES">ES</button>
        <button data-lang="GR">GR</button>
    </div>
    <span id="verseRef" title="2 Timoteo 2:15 RV60">Procura con diligencia presentarte a Dios aprobado, como obrero que no tiene de qué avergonzarse, que usa bien la palabra de verdad. — 2 Ti 2:15</span>
    <div class="header-right">
        <span id="termCount"></span>
        <button id="darkToggle" title="Modo oscuro">🌙</button>
    </div>
</header>
<main>
    <div id="sidebar">
        <div class="font-bar">
            <label>Texto:</label>
            <div class="font-group">
                <button class="font-btn" id="fontDecr" title="Reducir fuente">A−</button>
                <span id="fontSizeLabel">18</span>
                <button class="font-btn" id="fontIncr" title="Aumentar fuente">A+</button>
            </div>
        </div>
        <div class="recent-section" id="recentSection">
            <div class="recent-title">Búsquedas recientes <button class="clear-recent" id="clearRecent" title="Limpiar historial">✕</button></div>
            <div id="recentList"></div>
        </div>
        <div class="letter-bar" id="letterBar"></div>
        <div class="sidebar-results">
            <div class="no-results">Escribí una palabra para buscar</div>
        </div>
    </div>
    <div id="sidebarResize"></div>
    <div id="content">
        <div id="entry-view"></div>
    </div>
</main>

<div id="visitCounter"></div>

<script>
let entries = [];
let currentMatch = null;
let fontSize = parseInt(localStorage.getItem('kittelFontSize')) || 18;
let isDark = localStorage.getItem('kittelDark') === 'true';
let searchLang = 'ES';
const RECENT_KEY = 'kittelRecent';
const FAV_KEY = 'kittelFav';

const GREEK_MAP = {
    'a':'α','b':'β','g':'γ','d':'δ','e':'ε','z':'ζ','h':'η','i':'ι','k':'κ',
    'l':'λ','m':'μ','n':'ν','x':'ξ','o':'ο','p':'π','r':'ρ','s':'σ','t':'τ',
    'y':'υ','f':'φ','j':'θ','c':'χ','u':'υ','w':'ω','v':'β',
    'A':'Α','B':'Β','G':'Γ','D':'Δ','E':'Ε','Z':'Ζ','H':'Η','I':'Ι','K':'Κ',
    'L':'Λ','M':'Μ','N':'Ν','X':'Ξ','O':'Ο','P':'Π','R':'Ρ','S':'Σ','T':'Τ',
    'Y':'Υ','F':'Φ','J':'Θ','C':'Χ','U':'Υ','W':'Ω','V':'Β'
};
const GREEK_DIGRAPHS = { 'th':'θ','Th':'Θ','TH':'Θ','ph':'φ','Ph':'Φ','PH':'Φ','ch':'χ','Ch':'Χ','CH':'Χ','ps':'ψ','Ps':'Ψ','PS':'Ψ' };
function applyGreekTranslit(text) {
    if (searchLang !== 'GR') return text;
    let skip = false, result = '';
    for (let i = 0; i < text.length; i++) {
        if (skip) { skip = false; continue; }
        const digraph = text.slice(i, i+2);
        if (GREEK_DIGRAPHS[digraph]) { result += GREEK_DIGRAPHS[digraph]; skip = true; continue; }
        const ch = text[i];
        if (GREEK_MAP[ch]) { result += GREEK_MAP[ch]; continue; }
        result += ch;
    }
    const words = result.split(/(\s+)/);
    for (let i = 0; i < words.length; i++) {
        if (words[i].endsWith('σ') && /\S/.test(words[i])) {
            words[i] = words[i].slice(0, -1) + 'ς';
        }
    }
    return words.join('');
}
function stripGreekAccents(s) {
    return s.normalize('NFD').replace(/[\u0300-\u036F]/g, '');
}

const searchEl = document.getElementById('search');
const sidebarEl = document.getElementById('sidebar');
const sidebarResults = document.querySelector('.sidebar-results');
const fontSizeLabel = document.getElementById('fontSizeLabel');
const entryViewEl = document.getElementById('entry-view');
const darkToggle = document.getElementById('darkToggle');
const termCountEl = document.getElementById('termCount');
const recentListEl = document.getElementById('recentList');

if (isDark) document.documentElement.classList.add('dark');
darkToggle.textContent = isDark ? '☀️' : '🌙';
fontSizeLabel.textContent = fontSize;

(function() {
    const ck = 'kittelVisits';
    let v = parseInt(localStorage.getItem(ck)) || 0;
    if (!sessionStorage.getItem('kittelVisited')) {
        v++;
        localStorage.setItem(ck, v);
        sessionStorage.setItem('kittelVisited', '1');
    }
    document.getElementById('visitCounter').textContent = '👁 ' + v + (v === 1 ? ' visita' : ' visitas');
})();

function getRecent() { try { return JSON.parse(localStorage.getItem(RECENT_KEY)) || []; } catch { return []; } }
function saveRecent(arr) { localStorage.setItem(RECENT_KEY, JSON.stringify(arr.slice(0, 10))); }
function addRecent(q) {
    let r = getRecent().filter(x => x !== q);
    r.unshift(q);
    saveRecent(r);
    renderRecent();
}
function renderRecent() {
    const r = getRecent();
    if (!r.length) { recentListEl.innerHTML = '<span style="font-size:12px;color:var(--text-light)">—</span>'; return; }
    recentListEl.innerHTML = r.map(w => `<span class="recent-item" data-q="${escHtml(w)}">${escHtml(w)}</span>`).join('');
    recentListEl.querySelectorAll('.recent-item').forEach(el => {
        el.addEventListener('click', () => {
            searchEl.value = el.dataset.q;
            grRaw = '';
            onSearch();
        });
    });
}

function getFavs() { try { return JSON.parse(localStorage.getItem(FAV_KEY)) || {}; } catch { return {}; } }
function saveFavs(o) { localStorage.setItem(FAV_KEY, JSON.stringify(o)); }
function isFav(idx) { return !!getFavs()[idx]; }
function toggleFav(idx) {
    const f = getFavs();
    if (f[idx]) { delete f[idx]; } else { f[idx] = true; }
    saveFavs(f);
    const btn = entryViewEl.querySelector('.fav-btn');
    if (btn) btn.classList.toggle('saved', !!f[idx]);
}

function loadData() {
    fetch('datos.json.gz')
        .then(r => r.arrayBuffer())
        .then(buf => {
            const decompressed = pako.inflate(new Uint8Array(buf), { to: 'string' });
            entries = JSON.parse(decompressed);
            const totalTerms = entries.reduce((a, e) => a + e.e.length, 0);
            termCountEl.textContent = `${totalTerms.toLocaleString()} términos cargados`;
let grRaw = '';
let grFromBeforeinput = false;
            searchEl.addEventListener('beforeinput', (e) => {
                if (searchLang !== 'GR') return;
                if (e.inputType === 'insertText' && e.data && /^[\x00-\x7F]$/.test(e.data)) {
                    grRaw += e.data;
                    e.preventDefault();
                    grFromBeforeinput = true;
                    searchEl.value = applyGreekTranslit(grRaw);
                    onSearch();
                } else if (e.inputType === 'deleteContentBackward') {
                    grRaw = grRaw.slice(0, -1);
                    e.preventDefault();
                    grFromBeforeinput = true;
                    searchEl.value = applyGreekTranslit(grRaw);
                    onSearch();
                } else if (e.inputType === 'deleteContentForward') {
                    grRaw = grRaw.slice(0, -1);
                    e.preventDefault();
                    grFromBeforeinput = true;
                    searchEl.value = applyGreekTranslit(grRaw);
                    onSearch();
                } else if (e.inputType === 'insertFromPaste') {
                    e.preventDefault();
                    const pasted = e.data || '';
                    const latin = pasted.split('').filter(c => /^[\x00-\x7F]$/.test(c)).join('');
                    if (latin.length === pasted.length) {
                        grRaw += latin;
                        grFromBeforeinput = true;
                        searchEl.value = applyGreekTranslit(grRaw);
                    } else {
                        searchEl.value = pasted;
                        grRaw = '';
                    }
                    onSearch();
                } else if (e.inputType === 'insertCompositionText') {
                }
            });
            searchEl.addEventListener('input', () => {
                if (searchLang === 'GR' && !grFromBeforeinput) {
                    grRaw = '';
                }
                grFromBeforeinput = false;
                onSearch();
            });
            renderRecent();
            document.getElementById('clearRecent').addEventListener('click', () => {
                localStorage.removeItem(RECENT_KEY);
                renderRecent();
            });
            buildLetterIndex();
            if (searchEl.value) onSearch(); else showWelcome();
            document.querySelectorAll('.font-btn').forEach(btn => {
                if (btn.id === 'fontIncr') btn.addEventListener('click', () => changeFont(2));
                if (btn.id === 'fontDecr') btn.addEventListener('click', () => changeFont(-2));
            });
            darkToggle.addEventListener('click', toggleDark);
            const langBtns = document.querySelectorAll('#langSwitch button');
            langBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    searchLang = btn.dataset.lang;
                    langBtns.forEach(b => b.classList.toggle('active', b === btn));
                    searchEl.classList.toggle('gr', searchLang === 'GR');
                    searchEl.placeholder = searchLang === 'ES' ? 'Escribí una palabra en español…' : 'Escribí una palabra en griego…';
                    grRaw = '';
                    searchEl.value = '';
                    searchEl.focus();
                    onSearch();
                });
            });
            const resizeHandle = document.getElementById('sidebarResize');
            let resizeActive = false;
            resizeHandle.addEventListener('mousedown', e => {
                e.preventDefault();
                resizeActive = true;
                resizeHandle.classList.add('active');
                document.body.style.cursor = 'col-resize';
                document.body.style.userSelect = 'none';
            });
            document.addEventListener('mousemove', e => {
                if (!resizeActive) return;
                const w = Math.min(600, Math.max(200, e.clientX));
                document.getElementById('sidebar').style.width = w + 'px';
                document.getElementById('sidebar').style.minWidth = w + 'px';
            });
            document.addEventListener('mouseup', () => {
                if (resizeActive) {
                    resizeActive = false;
                    resizeHandle.classList.remove('active');
                    document.body.style.cursor = '';
                    document.body.style.userSelect = '';
                }
            });
        })
        .catch(() => {
            termCountEl.textContent = 'Error al cargar datos';
        });
}

function showWelcome() {
    const cards = ['Amor', 'Fe', 'Gracia', 'Misericordia', 'Justicia', 'Reino', 'Espíritu'];
    entryViewEl.innerHTML = `<div class="welcome">
        <h2>Diccionario Teológico del Nuevo Testamento</h2>
        <p class="sub">Basado en el Compendio de Kittel</p>
        <div class="quick-grid">${cards.map(w => `<div class="quick-card" data-w="${w}">${w}</div>`).join('')}</div>
    </div>`;
    entryViewEl.querySelectorAll('.quick-card').forEach(el => {
        el.addEventListener('click', () => {
            searchEl.value = el.dataset.w;
            grRaw = '';
            onSearch();
        });
    });
}

function onSearch() {
    const q = searchEl.value.toLowerCase().trim();
    if (!q) {
        sidebarResults.innerHTML = '<div class="no-results">' + (searchLang === 'ES' ? 'Escribí una palabra para buscar' : 'Escribí una palabra en griego') + '</div>';
        showWelcome();
        currentMatch = null;
        return;
    }
    addRecent(q);
    document.querySelectorAll('.letter-bar .l').forEach(l => l.classList.remove('active'));
    const matches = [];
    const isGr = searchLang === 'GR';
    for (let i = 0; i < entries.length; i++) {
        const e = entries[i];
        const items = isGr ? [e.g] : e.e;
        const matchStr = isGr ? stripGreekAccents(e.g.toLowerCase()) : e.e.join(' ').toLowerCase();
        const searchStr = isGr ? stripGreekAccents(q) : q;
        for (let s of items) {
            const testStr = isGr ? stripGreekAccents(s.toLowerCase()) : s.toLowerCase();
            if (testStr.includes(searchStr)) {
                matches.push({ idx: i, entry: e });
                break;
            }
        }
    }
    renderSidebar(matches);
    if (matches.length === 1) {
        showEntry(matches[0].idx);
    } else if (matches.length > 0 && currentMatch !== null) {
        const stillThere = matches.some(m => m.idx === currentMatch);
        if (!stillThere) {
            currentMatch = null;
            entryViewEl.innerHTML = `<div class="welcome"><h2>${matches.length} resultados</h2><p class="sub">Seleccioná una entrada de la lista</p></div>`;
        }
    } else {
        currentMatch = null;
        entryViewEl.innerHTML = `<div class="welcome"><h2>${matches.length === 0 ? 'Sin resultados' : matches.length + ' resultados'}</h2></div>`;
    }
}

function renderSidebar(matches) {
    if (matches.length === 0) {
        sidebarResults.innerHTML = '<div class="no-results">Sin resultados</div>';
        return;
    }
    let html = '';
    for (let m of matches) {
        const e = m.entry;
        const active = m.idx === currentMatch ? ' active' : '';
        const preview = e.t.slice(0, 150).replace(/\s+/g, ' ') + '…';
        html += `<div class="match${active}" data-idx="${m.idx}">
            <div class="griego">${escHtml(e.g.replace(/\[.*$/,'').split(',')[0].trim())}</div>
            <div class="espanol">${e.e.map(s => escHtml(s)).join(', ')}</div>
            <div class="preview">${(e.g + ' ' + e.t).replace(/\[[^\]]*$/, '').replace(/, ,/g, ', ').replace(/\s+/g, ' ').slice(0, 150)}…</div>
        </div>`;
    }
    sidebarResults.innerHTML = html;
    sidebarResults.querySelectorAll('.match').forEach(el => {
        el.addEventListener('click', () => {
            const idx = parseInt(el.dataset.idx);
            showEntry(idx);
        });
    });
}

function showEntry(idx) {
    const e = entries[idx];
    currentMatch = idx;
    sidebarResults.querySelectorAll('.match').forEach(el => {
        el.classList.toggle('active', parseInt(el.dataset.idx) === idx);
    });
    const fullEntry = (e.g + ' ' + e.t).replace(/\[[^\]]*$/, '').replace(/, ,/g, ',').replace(/,\s*$/, '').replace(/\s+,/g, ',').trim();
    let text = fullEntry
        .replace(/\s+(A\.|B\.|C\.|D\.|E\.|F\.|G\.)\s/g, '<br><br><span class="section-title">$1</span> ')
        .replace(/\s+(\d+\.)\s/g, '<br><br><span class="section-title">$1</span> ');
    text = text.replace(/([\u0370-\u03FF\u1F00-\u1FFF]{2,}(?:\s*[\u0370-\u03FF\u1F00-\u1FFF]+)*)/g, '<span class="greek-word">$1</span>');
    const saved = isFav(idx) ? ' saved' : '';
    const shareUrl = `${window.location.origin}${window.location.pathname}?q=${encodeURIComponent(e.e[0] || '')}`;
    entryViewEl.innerHTML = `
        <div class="entry-card">
            <div class="entry-header">
            <div class="griego">${escHtml(e.g.replace(/\[.*$/,'').split(',')[0].trim())}</div>
                <div class="espanol">${e.e.map(s => '<span class="badge">' + escHtml(s) + '</span>').join('')}</div>
                <div class="header-meta">
                    <span class="page-badge">Kittel pág. ${e.p || '—'}</span>
                    <button class="fav-btn${saved}" data-idx="${idx}" title="Favorito">★</button>
                    <button class="copy-btn" data-idx="${idx}" title="Copiar entrada">📋</button>
                    <button class="share-btn" data-share="${escHtml(shareUrl)}" title="Compartir">🔗</button>
                </div>
            </div>
            <div class="entry-text">${text}</div>
        </div>`;
    entryViewEl.querySelector('.entry-text').style.fontSize = fontSize + 'px';
    entryViewEl.scrollTop = 0;
    entryViewEl.querySelector('.fav-btn')?.addEventListener('click', () => toggleFav(idx));
    entryViewEl.querySelector('.copy-btn')?.addEventListener('click', () => {
        const plain = fullEntry;
        navigator.clipboard.writeText(plain).then(() => {
            const btn = entryViewEl.querySelector('.copy-btn');
            btn.textContent = '✓';
            setTimeout(() => { btn.textContent = '📋'; }, 1500);
        }).catch(() => {});
    });
    entryViewEl.querySelector('.share-btn')?.addEventListener('click', () => {
        const url = entryViewEl.querySelector('.share-btn').dataset.share;
        navigator.clipboard.writeText(url).then(() => {
            const btn = entryViewEl.querySelector('.share-btn');
            btn.textContent = '✓';
            setTimeout(() => { btn.textContent = '🔗'; }, 1500);
        }).catch(() => {});
    });
}

function toggleDark() {
    isDark = !isDark;
    document.documentElement.classList.toggle('dark', isDark);
    localStorage.setItem('kittelDark', isDark);
    darkToggle.textContent = isDark ? '☀️' : '🌙';
}

function escHtml(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
}

function changeFont(delta) {
    fontSize = Math.min(28, Math.max(12, fontSize + delta));
    localStorage.setItem('kittelFontSize', fontSize);
    const el = entryViewEl.querySelector('.entry-text');
    if (el) el.style.fontSize = fontSize + 'px';
    fontSizeLabel.textContent = fontSize;
}

const letterIndex = {};
function normGreek(c) {
    const base = c.normalize('NFD')[0];
    return base.toUpperCase();
}
function buildLetterIndex() {
    const byLetter = {};
    for (let i = 0; i < entries.length; i++) {
        const greek = entries[i].g.replace(/\[.*$/, '').split(',')[0].trim();
        if (!greek) continue;
        const c = normGreek(greek.charAt(0));
        if (!byLetter[c]) byLetter[c] = [];
        byLetter[c].push(i);
    }
    for (const c of Object.keys(byLetter)) {
        letterIndex[c] = byLetter[c];
    }
    const bar = document.getElementById('letterBar');
    let html = '';
    for (const c of 'αβγδεζηθικλμνξοπρστυφχψω') {
        const upper = c.toUpperCase();
        if (byLetter[upper]) {
            html += `<span class="l" data-l="${escHtml(upper)}">${escHtml(c)}<span class="cnt">${byLetter[upper].length}</span></span>`;
        } else {
            html += `<span class="l" style="opacity:0.2;cursor:default">${escHtml(c)}</span>`;
        }
    }
    bar.innerHTML = html;
    bar.addEventListener('click', e => {
        const el = e.target.closest('.l');
        if (!el || !el.dataset.l) return;
        const letter = el.dataset.l;
        const ids = letterIndex[letter];
        if (!ids) return;
        document.querySelectorAll('.letter-bar .l').forEach(l => l.classList.remove('active'));
        el.classList.add('active');
        const matches = ids.map(idx => ({ idx, entry: entries[idx] }));
        renderSidebar(matches);
        if (matches.length > 0) showEntry(matches[0].idx);
        currentMatch = null;
    });
}

loadData();
</script>
